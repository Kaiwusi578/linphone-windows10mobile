name: Build Linphone Windows Mobile
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Code Base Only
        uses: actions/checkout@v4
        with:
          submodules: false # Force GitHub to skip downloading submodules automatically

      - name: Redirect Broken Server Links & Fetch Dependencies
        run: |
          # Redirect Linphone links to modern GitHub mirrors
          git config --global url."https://github.com".insteadOf "git://git.linphone.org/"
          git config --global url."https://github.com".insteadOf "https://linphone.org"
          
          # Redirect the broken Gnome server link to GitHub's official Libxml2 mirror
          git config --global url."https://github.com".insteadOf "git://git.gnome.org/"

          # Manually tell git to safely link and clone submodules with our redirection rules active
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.x'

      - name: Prepare Build Environment
        run: |
          python prepare.py -DENABLE_UWP=ON

      - name: Compile UWP App
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Linphone-WindowsMobile-Package
          path: build/**/*.appx*
