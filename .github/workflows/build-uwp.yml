name: Build Linphone Windows Mobile Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code Base Only
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Redirect Broken Server Links & Fetch Dependencies
        run: |
          git config --global url."https://github.com".insteadOf "git://git.linphone.org/"
          git config --global url."https://github.com".insteadOf "https://linphone.org"
          git config --global url."https://github.com".insteadOf "git://git.gnome.org/"
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Setup Legacy Python 2.7
        uses: actions/setup-python@v5
        with:
          python-version: '2.7' # Downgrades to Python 2 which the script requires

      - name: Install Compatible CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.15.x' # Older CMake to properly parse legacy configurations

      - name: Setup MSBuild Path
        uses: microsoft/setup-msbuild@v2

      - name: Run Legacy Linphone Preparation Script
        run: |
          python prepare.py -DENABLE_UWP=ON -DENABLE_DEBUG_LOGS=OFF

      - name: Compile Solution File via MSBuild
        run: |
          cd build
          msbuild linphone.sln /p:Configuration=Release /p:Platform="ARM" /p:AppxBundle=Always

      - name: Upload Finished App Package
        uses: actions/upload-artifact@v4
        with:
          name: Linphone-WindowsMobile-Package
          path: |
            build/**/*.appx
            build/**/*.appxbundle
